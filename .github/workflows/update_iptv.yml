name: Update IPTV Playlist

on:
  schedule:
    - cron: '0 0 * * *' # S'exécute tous les jours à minuit
  workflow_dispatch: # Permet un déclenchement manuel depuis l'interface GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        pip install requests

    - name: Filter and Organize IPTV
      run: |
        python <<'PY'
        import re
        import unicodedata

        import requests

        african_countries = {
            "Algeria", "Angola", "Benin", "Botswana", "Burkina Faso", "Burundi",
            "Cabo Verde", "Cameroon", "Central African Republic", "Chad", "Comoros",
            "Congo", "Democratic Republic of the Congo", "Djibouti", "Egypt",
            "Equatorial Guinea", "Eritrea", "Eswatini", "Ethiopia", "Gabon",
            "Gambia", "Ghana", "Guinea", "Guinea-Bissau", "Ivory Coast", "Kenya",
            "Lesotho", "Liberia", "Libya", "Madagascar", "Malawi", "Mali",
            "Mauritania", "Mauritius", "Morocco", "Mozambique", "Namibia", "Niger",
            "Nigeria", "Rwanda", "Sao Tome and Principe", "Senegal", "Seychelles",
            "Sierra Leone", "Somalia", "South Africa", "South Sudan", "Sudan",
            "Tanzania", "Togo", "Tunisia", "Uganda", "Zambia", "Zimbabwe",
        }
        country_aliases = {
            "Cape Verde",
            "Cote d'Ivoire",
            "Côte d'Ivoire",
            "Congo-Brazzaville",
            "DR Congo",
            "Congo-Kinshasa",
            "Swaziland",
            "Sao Tome & Principe",
            "São Tomé and Príncipe",
        }

        def normalize(value):
            value = unicodedata.normalize("NFKD", value)
            value = value.encode("ascii", "ignore").decode("ascii").casefold()
            return re.sub(r"[^a-z0-9]+", " ", value).strip()

        country_names = {normalize(country) for country in african_countries}
        country_names.update(normalize(alias) for alias in country_aliases)

        response = requests.get(
            "https://iptv-org.github.io/iptv/index.country.m3u", timeout=60
        )
        response.raise_for_status()

        output_lines = ["#EXTM3U", "#EXTVLCOPT:http-user-agent=Mozilla/5.0"]
        current_inf = None
        keep = False
        channel_count = 0

        for line in response.text.splitlines():
            if line.startswith("#EXTINF:"):
                current_inf = line
                group = re.search(r'group-title="([^"]*)"', line)
                country = group.group(1) if group else ""
                channel_metadata = normalize(line).split()
                premium_channel = (
                    re.search(r"\bcanal\s*\+|\bcanal\s+plus\b", line, re.IGNORECASE)
                    or "bein" in channel_metadata
                )
                keep = (
                    normalize(country) in country_names
                    and not premium_channel
                )
            elif line.startswith("http"):
                if keep and current_inf:
                    output_lines.extend((current_inf, line))
                    channel_count += 1
                current_inf = None
                keep = False

        if channel_count == 0:
            raise SystemExit("Aucune chaîne africaine trouvée; playlist non générée.")

        with open("playlist_afrique.m3u", "w", encoding="utf-8") as playlist:
            playlist.write("\n".join(output_lines) + "\n")
        print(f"Playlist africaine générée : {channel_count} chaînes.")
        PY

    - name: Commit and Push changes
      run: |
        git config --global user.name 'GitHub Action'
        git config --global user.email 'action@github.com'
        git add playlist_afrique.m3u
        git commit -m "Mise à jour automatique de la playlist africaine" || exit 0
        git push