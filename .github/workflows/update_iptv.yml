name: Update IPTV Playlist

on:
  push:
    branches:
      - main
    paths-ignore:
      - playlist_afrique.m3u
      - playlist_bouquet.m3u
  schedule:
    - cron: '0 0 * * *' # S'exécute tous les jours à minuit
  workflow_dispatch: # Permet un déclenchement manuel depuis l'interface GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        pip install requests

    - name: Select French and English Channels and Build Bouquets
      run: |
        python <<'PY'
        import re
        import unicodedata

        import requests

        regions = {
            "Afrique": {
                "Algeria", "Angola", "Benin", "Botswana", "Burkina Faso",
                "Burundi", "Cabo Verde", "Cameroon", "Central African Republic",
                "Chad", "Comoros", "Congo", "Democratic Republic of the Congo",
                "Djibouti", "Egypt", "Equatorial Guinea", "Eritrea", "Eswatini",
                "Ethiopia", "Gabon", "Gambia", "Ghana", "Guinea", "Guinea-Bissau",
                "Ivory Coast", "Kenya", "Lesotho", "Liberia", "Libya", "Madagascar",
                "Malawi", "Mali", "Mauritania", "Mauritius", "Morocco", "Mozambique",
                "Namibia", "Niger", "Nigeria", "Rwanda", "Sao Tome and Principe",
                "Senegal", "Seychelles", "Sierra Leone", "Somalia", "South Africa",
                "South Sudan", "Sudan", "Tanzania", "Togo", "Tunisia", "Uganda",
                "Zambia", "Zimbabwe",
            },
            "Europe": {
                "Albania", "Andorra", "Austria", "Belarus", "Belgium",
                "Bosnia and Herzegovina", "Bulgaria", "Croatia", "Cyprus",
                "Czech Republic", "Denmark", "Estonia", "Finland", "France",
                "Germany", "Greece", "Hungary", "Iceland", "Ireland", "Italy",
                "Kosovo", "Latvia", "Liechtenstein", "Lithuania", "Luxembourg",
                "Malta", "Moldova", "Monaco", "Montenegro", "Netherlands",
                "North Macedonia", "Norway", "Poland", "Portugal", "Romania",
                "Russia", "San Marino", "Serbia", "Slovakia", "Slovenia", "Spain",
                "Sweden", "Switzerland", "Ukraine", "United Kingdom", "Vatican City",
            },
            "Amériques": {
                "Antigua and Barbuda", "Argentina", "Bahamas", "Barbados", "Belize",
                "Bermuda", "Bolivia", "Brazil", "Canada", "Chile", "Colombia",
                "Costa Rica", "Cuba", "Dominica", "Dominican Republic", "Ecuador",
                "El Salvador", "Grenada", "Guatemala", "Guyana", "Haiti", "Honduras",
                "Guadeloupe", "Jamaica", "Martinique", "Mexico", "Nicaragua",
                "Panama", "Paraguay", "Peru",
                "Saint Kitts and Nevis", "Saint Lucia", "Saint Vincent and the Grenadines",
                "Suriname", "Trinidad and Tobago", "United States", "Uruguay",
                "Venezuela",
            },
            "Moyen-Orient": {
                "Bahrain", "Iran", "Iraq", "Israel", "Jordan", "Kuwait", "Lebanon",
                "Oman", "Palestine", "Qatar", "Saudi Arabia", "Syria", "Turkey",
                "United Arab Emirates", "Yemen",
            },
            "Asie": {
                "Afghanistan", "Armenia", "Azerbaijan", "Bangladesh", "Bhutan",
                "Brunei", "Cambodia", "China", "Georgia", "Hong Kong", "India",
                "Indonesia", "Japan", "Kazakhstan", "Kyrgyzstan", "Laos", "Macau",
                "Malaysia", "Maldives", "Mongolia", "Myanmar", "Nepal", "North Korea",
                "Pakistan", "Philippines", "Singapore", "South Korea", "Sri Lanka",
                "Taiwan", "Tajikistan", "Thailand", "Timor-Leste", "Turkmenistan",
                "Uzbekistan", "Vietnam",
            },
            "Océanie": {
                "Australia", "Fiji", "Kiribati", "Marshall Islands",
                "Micronesia", "Nauru", "New Zealand", "Palau", "Papua New Guinea",
                "Samoa", "Solomon Islands", "Tonga", "Tuvalu", "Vanuatu",
            },
        }
        country_aliases = {
            "Cape Verde": "Cabo Verde",
            "Cote d'Ivoire": "Ivory Coast",
            "Côte d'Ivoire": "Ivory Coast",
            "Congo-Brazzaville": "Congo",
            "Republic of the Congo": "Congo",
            "DR Congo": "Democratic Republic of the Congo",
            "Congo-Kinshasa": "Democratic Republic of the Congo",
            "Swaziland": "Eswatini",
            "Sao Tome & Principe": "Sao Tome and Principe",
            "São Tomé and Príncipe": "Sao Tome and Principe",
            "United States of America": "United States",
            "Türkiye": "Turkey",
            "Republic of Korea": "South Korea",
            "Democratic People's Republic of Korea": "North Korea",
            "Czechia": "Czech Republic",
            "The Gambia": "Gambia",
            "The Bahamas": "Bahamas",
        }

        def normalize(value):
            value = unicodedata.normalize("NFKD", value)
            value = value.encode("ascii", "ignore").decode("ascii").casefold()
            return re.sub(r"[^a-z0-9]+", " ", value).strip()

        country_regions = {
            normalize(country): region
            for region, countries in regions.items()
            for country in countries
        }
        country_regions.update(
            (normalize(alias), country_regions[normalize(country)])
            for alias, country in country_aliases.items()
        )

        country_response = requests.get(
            "https://iptv-org.github.io/iptv/index.country.m3u", timeout=60
        )
        country_response.raise_for_status()
        country_by_channel = {}
        current_inf = None

        for line in country_response.text.splitlines():
            if line.startswith("#EXTINF:"):
                current_inf = line
            elif line.startswith("http") and current_inf:
                channel_id = re.search(r'tvg-id="([^"]*)"', current_inf)
                country = re.search(r'group-title="([^"]*)"', current_inf)
                if channel_id and country:
                    country_by_channel[channel_id.group(1)] = country.group(1)
                current_inf = None

        bouquet_categories = {
            "sports": "Sports",
            "sport": "Sports",
            "movies": "Films et séries",
            "series": "Films et séries",
            "entertainment": "Divertissement",
            "music": "Musique",
            "kids": "Jeunesse",
            "children": "Jeunesse",
            "news": "Actualités",
            "culture": "Culture",
            "documentary": "Documentaires",
            "general": "Généralistes",
            "religious": "Religieuses",
        }

        def set_attribute(metadata, name, value):
            attribute = re.compile(rf'(?<!\S){re.escape(name)}="[^"]*"')
            replacement = f'{name}="{value}"'
            if attribute.search(metadata):
                return attribute.sub(replacement, metadata, count=1)
            title_separator = metadata.find(",")
            if title_separator == -1:
                return metadata
            return (
                metadata[:title_separator]
                + f" {replacement}"
                + metadata[title_separator:]
            )

        main_entries = []
        bouquet_entries = []
        seen_urls = set()
        region_counts = {region: 0 for region in regions}
        region_counts["Autres"] = 0
        bouquet_counts = {category: 0 for category in set(bouquet_categories.values())}
        french_channel_count = 0
        english_channel_count = 0

        for language_code in ("fra", "eng"):
            language_response = requests.get(
                f"https://iptv-org.github.io/iptv/languages/{language_code}.m3u",
                timeout=60,
            )
            language_response.raise_for_status()
            current_inf = None

            for line in language_response.text.splitlines():
                if line.startswith("#EXTINF:"):
                    current_inf = line
                elif line.startswith("http") and current_inf:
                    channel_id = re.search(r'tvg-id="([^"]*)"', current_inf)
                    country = country_by_channel.get(
                        channel_id.group(1) if channel_id else "", ""
                    )
                    premium_channel = (
                        re.search(
                            r"\bcanal\s*\+|\bcanal\s+plus\b",
                            current_inf,
                            re.IGNORECASE,
                        )
                        or re.search(r"\bbein\b", current_inf, re.IGNORECASE)
                    )

                    if channel_id and country and not premium_channel and line not in seen_urls:
                        seen_urls.add(line)
                        region = country_regions.get(normalize(country), "Autres")
                        regional_metadata = set_attribute(
                            current_inf, "group-title", region
                        )
                        regional_metadata = set_attribute(
                            regional_metadata, "tvg-country", country
                        )
                        main_entries.append((regional_metadata, line))
                        region_counts[region] += 1

                        if language_code == "fra":
                            french_channel_count += 1
                        else:
                            english_channel_count += 1

                        original_group = re.search(
                            r'group-title="([^"]*)"', current_inf
                        )
                        genre = normalize(original_group.group(1)) if original_group else ""
                        category = bouquet_categories.get(genre)
                        if category:
                            bouquet_metadata = set_attribute(
                                current_inf, "group-title", category
                            )
                            bouquet_metadata = set_attribute(
                                bouquet_metadata, "tvg-country", country
                            )
                            bouquet_entries.append((bouquet_metadata, line))
                            bouquet_counts[category] += 1
                    current_inf = None

        if not main_entries:
            raise SystemExit("Aucune chaîne française ou anglaise trouvée.")
        if not bouquet_entries:
            raise SystemExit("Aucune chaîne gratuite de bouquet trouvée.")

        for filename, entries in (
            ("playlist_afrique.m3u", main_entries),
            ("playlist_bouquet.m3u", bouquet_entries),
        ):
            output_lines = ["#EXTM3U", "#EXTVLCOPT:http-user-agent=Mozilla/5.0"]
            for metadata, url in entries:
                output_lines.extend((metadata, url))
            with open(filename, "w", encoding="utf-8") as playlist:
                playlist.write("\n".join(output_lines) + "\n")

        print(
            f"Playlist bilingue générée : {len(main_entries)} chaînes "
            f"({french_channel_count} françaises, {english_channel_count} anglaises)."
        )
        for region, count in region_counts.items():
            if count:
                print(f"{region} : {count} chaînes")
        print(f"Bouquet gratuit généré : {len(bouquet_entries)} chaînes.")
        for category, count in sorted(bouquet_counts.items()):
            if count:
                print(f"{category} : {count} chaînes")
        PY

    - name: Commit and Push changes
      run: |
        git config --global user.name 'GitHub Action'
        git config --global user.email 'action@github.com'
        git add playlist_afrique.m3u playlist_bouquet.m3u
        git commit -m "Mise à jour automatique des bouquets IPTV" || exit 0
        git push